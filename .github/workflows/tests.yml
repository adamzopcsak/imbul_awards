# Runs the tests (tests/, standard library only) on every pull request and on every push to main,
# so a pull request shows a green or red check before it is merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # the version on the server (Ubuntu 24.04)
      - run: python -m unittest discover -s tests -v
